apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwave-js-ui
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zwave-js-ui
  template:
    metadata:
      labels:
        app: zwave-js-ui
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab4
      containers:
        - name: zwave-js-ui
          image: zwavejs/zwave-js-ui:latest
          ports:
            - containerPort: 8091
            - containerPort: 3000
          env:
            - name: TZ
              value: "UTC"
          volumeMounts:
            - name: config
              mountPath: /usr/src/app/store
            - name: usb-device0
              mountPath: /dev/ttyUSB0
              readOnly: false
            - name: usb-device1
              mountPath: /dev/ttyUSB1
              readOnly: false
            - name: usb-by-id
              mountPath: /dev/serial/by-id
              readOnly: false
          securityContext:
            runAsUser: 0
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_RAWIO   # Only if needed for low-level I/O
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: zwave-config
        - name: usb-device0
          hostPath:
            path: /dev/ttyUSB0
            type: CharDevice
        - name: usb-device1
          hostPath:
            path: /dev/ttyUSB1
            type: CharDevice
        - name: usb-by-id
          hostPath:
            path: /dev/serial/by-id
            type: Directory
