apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-pvc
  namespace: home-assistant
  annotations:
    volume.beta.kubernetes.io/storage-class: "truenas-nvmeof"
spec:
  storageClassName: truenas-nvmeof
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi